<title>座位抽籤</title>
<style>
  :root{
    --bg:#f3f1ec;
    --surface:#ffffff;
    --ink:#26241f;
    --ink-soft:#6b6a63;
    --line:#e2ded3;
    --accent:#c1502e;
    --accent-soft:#f0d9cd;
    --seat-empty:#faf9f6;
    --seat-taken:#2f5d4f;
    --seat-taken-text:#eef4f1;
    --shadow:0 1px 2px rgba(38,36,31,.06), 0 6px 20px rgba(38,36,31,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1a17;
      --surface:#242320;
      --ink:#eeece5;
      --ink-soft:#a6a399;
      --line:#39372f;
      --accent:#e07a52;
      --accent-soft:#3a2a22;
      --seat-empty:#2a2925;
      --seat-taken:#3f7263;
      --seat-taken-text:#eef4f1;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1a17;
    --surface:#242320;
    --ink:#eeece5;
    --ink-soft:#a6a399;
    --line:#39372f;
    --accent:#e07a52;
    --accent-soft:#3a2a22;
    --seat-empty:#2a2925;
    --seat-taken:#3f7263;
    --seat-taken-text:#eef4f1;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    padding:32px 16px 48px;
    padding-block:32px 48px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  header{margin-bottom:28px;text-align:center;}
  h1{
    font-size:clamp(22px,4vw,30px);
    margin:0 0 6px;
    letter-spacing:.02em;
    text-wrap:balance;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:24px;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:0 0 14px;
  }

  /* People roster */
  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
    gap:12px;
  }
  .person{
    border:2px solid transparent;
    background:var(--seat-empty);
    border-radius:12px;
    padding:10px 8px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    font:inherit;
    color:inherit;
  }
  .person:hover:not(:disabled){transform:translateY(-2px);}
  .person:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .person.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .person:disabled{opacity:.4;cursor:not-allowed;}
  .person.my-turn:disabled{opacity:1;}
  .avatar{
    width:64px;height:64px;border-radius:50%;
    overflow:hidden;flex:none;
    background:var(--line);
    position:relative;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .order-badge{
    position:absolute;
    top:-4px;right:-4px;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px var(--surface);
  }
  .person-name{font-size:13px;font-weight:600;text-align:center;line-height:1.3;}
  .person-status{font-size:11px;color:var(--ink-soft);}
  .person.my-turn{
    border-color:var(--accent);
    border-width:3px;
    background:var(--accent);
    box-shadow:0 10px 26px rgba(193,80,46,.4);
    transform:scale(1.06);
    z-index:1;
    animation:turn-pulse 1.5s ease-in-out infinite;
  }
  .person.my-turn .avatar{box-shadow:0 0 0 3px rgba(255,255,255,.9);}
  .person.my-turn .person-name{color:#fff;}
  .person.my-turn .person-status{
    color:#fff;
    font-weight:800;
    background:rgba(255,255,255,.22);
    border-radius:999px;
    padding:2px 10px;
  }
  @keyframes turn-pulse{
    0%,100%{ transform:scale(1.06); box-shadow:0 10px 26px rgba(193,80,46,.4); }
    50%{ transform:scale(1.1); box-shadow:0 14px 34px rgba(193,80,46,.55); }
  }
  @media (prefers-reduced-motion: reduce){
    .person.my-turn{ animation:none; transform:scale(1.06); }
  }

  .draw-row{
    display:flex;
    justify-content:center;
    margin-top:16px;
  }
  button.draw{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 28px;
    border-radius:999px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .12s ease, transform .12s ease;
  }
  button.draw:hover:not(:disabled){transform:translateY(-1px);}
  button.draw:disabled{opacity:.35;cursor:not-allowed;}

  .phase-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:10px 0 0;
  }

  /* Seat grid: 2x2 + 1 centered below */
  .seat-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .seat-grid{
    display:grid;
    grid-template-columns:32px minmax(120px,180px) 28px minmax(120px,180px);
    column-gap:0;
    row-gap:14px;
    width:100%;
    max-width:440px;
  }
  .door{
    grid-column:1;
    grid-row:3;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .door-label{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:11px;
    letter-spacing:.2em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .aisle{
    grid-column:3;
    grid-row:1 / -1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .aisle::before{
    content:'';
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    border-left:1px dashed var(--line);
  }
  .aisle-label{
    position:relative;
    z-index:1;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:11px;
    letter-spacing:.2em;
    color:var(--ink-soft);
    background:var(--surface);
    padding:8px 2px;
  }
  .seat-heading{margin-top:24px;}
  .seat{
    aspect-ratio:1/1;
    border-radius:14px;
    border:2px dashed var(--line);
    background:var(--seat-empty);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font:inherit;
    color:var(--ink-soft);
    transition:border-color .12s ease, transform .12s ease;
    position:relative;
    padding:10px;
  }
  .seat:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px);}
  .seat:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .seat-label{
    position:absolute;
    top:8px;left:10px;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .seat-hint{font-size:12px;}
  .seat.taken{
    border-style:solid;
    border-color:var(--seat-taken);
    background:var(--seat-taken);
    color:var(--seat-taken-text);
    cursor:default;
  }
  .seat.taken .seat-label{color:var(--seat-taken-text);opacity:.75;}
  .seat.locked{
    cursor:not-allowed;
    opacity:.55;
  }
  .seat-avatar{
    width:52px;height:52px;border-radius:50%;
    overflow:hidden;border:2px solid var(--seat-taken-text);
  }
  .seat-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .seat-name{font-size:13px;font-weight:700;}
  .seat-badge{
    position:absolute;top:8px;right:8px;
    font-size:14px;
  }

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  button.reset{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px 18px;
    border-radius:999px;
    font:inherit;
    font-size:13px;
    cursor:pointer;
    transition:border-color .12s ease,color .12s ease;
  }
  button.reset:hover{border-color:var(--accent);color:var(--accent);}

  .banner{
    text-align:center;
    font-size:13px;
    color:var(--accent);
    min-height:18px;
    margin-top:4px;
  }

  /* Draw reveal overlay */
  .draw-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,18,14,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    cursor:pointer;
    padding:16px;
  }
  .draw-overlay .confetti{
    position:absolute;
    top:-24px;
    width:9px;
    height:16px;
    opacity:.95;
    animation-name:confetti-fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
    border-radius:2px;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(112vh) rotate(680deg); opacity:.85; }
  }
  .draw-card{
    position:relative;
    background:var(--surface);
    border-radius:20px;
    padding:32px 36px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    max-width:280px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    animation:card-pop .5s cubic-bezier(.2,1.4,.4,1) both;
    cursor:default;
  }
  .draw-card.shake{animation:card-pop .5s cubic-bezier(.2,1.4,.4,1) both, card-shake .5s ease .5s 2;}
  @keyframes card-pop{
    0%{ transform:scale(.35) rotate(-6deg); opacity:0; }
    65%{ transform:scale(1.1) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes card-shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .draw-card .avatar{width:76px;height:76px;}
  .draw-card .draw-eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .draw-card .draw-name{font-size:17px;font-weight:700;}
  .draw-number{
    position:relative;
    font-size:56px;
    font-weight:800;
    line-height:1;
    color:var(--accent);
    margin:6px 0 2px;
    animation:number-pop .55s cubic-bezier(.2,1.5,.4,1) .15s both;
  }
  @keyframes number-pop{
    0%{ transform:scale(0); opacity:0; }
    70%{ transform:scale(1.25); opacity:1; }
    100%{ transform:scale(1); }
  }
  .draw-number.glow{ animation:number-pop .55s cubic-bezier(.2,1.5,.4,1) .15s both, number-glow 1.1s ease .7s infinite; }
  @keyframes number-glow{
    0%,100%{ text-shadow:0 0 0 rgba(193,80,46,0); }
    50%{ text-shadow:0 0 24px var(--accent), 0 0 48px var(--accent-soft); }
  }
  .draw-caption{font-size:13px;color:var(--ink-soft);}
  .draw-rays{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent-soft), transparent 18%, var(--accent-soft) 36%, transparent 54%, var(--accent-soft) 72%, transparent 90%, var(--accent-soft));
    opacity:.5;
    z-index:-1;
    animation:rays-spin 6s linear infinite;
  }
  @keyframes rays-spin{ to{ transform:rotate(360deg); } }
  .draw-hint{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .complete-card{max-width:320px;}
  .complete-emoji{
    font-size:56px;
    line-height:1;
    margin:4px 0 0;
    animation:number-pop .55s cubic-bezier(.2,1.5,.4,1) .15s both;
  }
  .lineup{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:8px;
  }
  .lineup-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .lineup-avatar{
    width:40px;height:40px;border-radius:50%;
    overflow:hidden;
    border:2px solid var(--accent-soft);
  }
  .lineup-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .lineup-seat{font-size:11px;color:var(--ink-soft);font-weight:600;}
</style>

<div class="wrap">
  <header>
    <h1>座位抽籤</h1>
    <p class="sub" id="subTitle">先選擇一位人員，按下「抽籤」決定順序</p>
  </header>

  <section class="panel" id="pageDraw">
    <h2>人員名單</h2>
    <div class="roster" id="roster"></div>
    <div class="draw-row">
      <button class="draw" id="drawBtn" type="button" disabled>抽籤</button>
    </div>
    <p class="phase-note" id="phaseNote">請先選擇一位人員，再按抽籤</p>
    <div class="actions">
      <button class="reset" id="resetBtnDraw" type="button">重新抽籤</button>
    </div>
  </section>

  <section class="panel" id="pageSeat" hidden>
    <h2>抽籤順序</h2>
    <div class="roster" id="rosterSeat"></div>
    <p class="phase-note" id="phaseNoteSeat"></p>
    <h2 class="seat-heading">座位配置</h2>
    <div class="seat-area">
      <div class="seat-grid" id="seatGrid"></div>
    </div>
    <p class="banner" id="banner">&nbsp;</p>
    <div class="actions">
      <button class="reset" id="resetBtn" type="button">重新抽籤</button>
    </div>
  </section>
</div>

<script>
(function(){
  var PEOPLE = [
    { id: 'p1', name: '李承軒', img: 'photos/person1.png' },
    { id: 'p2', name: 'AlexYang', img: 'photos/person2.png' },
    { id: 'p3', name: 'Yvonne', img: 'photos/person3.png' },
    { id: 'p4', name: 'Raino', img: 'photos/person4.png' },
    { id: 'p5', name: '智輝', img: 'photos/person5.png' }
  ];

  var state = {
    selectedPerson: null,
    order: {},  // personId -> draw order number
    seats: {}   // seatId -> personId
  };

  function save(){
    try{ window.claude?.hot?.snapshot?.(state); }catch(e){}
  }

  var rosterEl = document.getElementById('roster');
  var rosterSeatEl = document.getElementById('rosterSeat');
  var seatGridEl = document.getElementById('seatGrid');
  var bannerEl = document.getElementById('banner');
  var resetBtn = document.getElementById('resetBtn');
  var drawBtn = document.getElementById('drawBtn');
  var phaseNoteEl = document.getElementById('phaseNote');
  var phaseNoteSeatEl = document.getElementById('phaseNoteSeat');
  var subTitleEl = document.getElementById('subTitle');
  var pageDrawEl = document.getElementById('pageDraw');
  var pageSeatEl = document.getElementById('pageSeat');

  function personById(id){
    for (var i=0;i<PEOPLE.length;i++) if (PEOPLE[i].id===id) return PEOPLE[i];
    return null;
  }

  function isPersonSeated(personId){
    for (var seatId in state.seats){
      if (state.seats[seatId] === personId) return true;
    }
    return false;
  }

  function seatOfPerson(personId){
    for (var seatId in state.seats){
      if (state.seats[seatId] === personId) return seatId;
    }
    return null;
  }

  function allDrawn(){
    return PEOPLE.every(function(p){ return state.order[p.id] != null; });
  }

  function currentTurnPersonId(){
    var best = null;
    PEOPLE.forEach(function(p){
      if (state.order[p.id] == null) return;
      if (isPersonSeated(p.id)) return;
      if (best === null || state.order[p.id] < state.order[best]) best = p.id;
    });
    return best;
  }

  function renderRoster(){
    var drawPhaseDone = allDrawn();
    var turnId = drawPhaseDone ? currentTurnPersonId() : null;
    var activeEl = drawPhaseDone ? rosterSeatEl : rosterEl;
    var inactiveEl = drawPhaseDone ? rosterEl : rosterSeatEl;
    activeEl.innerHTML = '';
    inactiveEl.innerHTML = '';

    PEOPLE.forEach(function(p){
      var seated = isPersonSeated(p.id);
      var hasOrder = state.order[p.id] != null;
      var isTurn = turnId === p.id;

      var selectable;
      if (seated || drawPhaseDone){
        selectable = false;
      } else {
        selectable = !hasOrder;
      }

      var status;
      if (seated){
        status = '已入座 ' + seatOfPerson(p.id);
      } else if (!hasOrder){
        status = drawPhaseDone ? '未參與抽籤' : '尚未抽籤';
      } else if (drawPhaseDone){
        status = isTurn ? '輪到你選位' : ('等待中 · 第 ' + state.order[p.id] + ' 順位');
      } else {
        status = '已抽到第 ' + state.order[p.id] + ' 順位';
      }

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'person'
        + (state.selectedPerson === p.id ? ' selected' : '')
        + (isTurn && !seated ? ' my-turn' : '');
      btn.disabled = !selectable;
      btn.id = 'person-' + p.id;
      btn.innerHTML =
        '<span class="avatar">' +
          '<img src="' + p.img + '" alt="' + p.name + '">' +
          (hasOrder ? '<span class="order-badge">' + state.order[p.id] + '</span>' : '') +
        '</span>' +
        '<span class="person-name">' + p.name + '</span>' +
        '<span class="person-status">' + status + '</span>';
      if (!drawPhaseDone) btn.addEventListener('click', function(){
        state.selectedPerson = (state.selectedPerson === p.id) ? null : p.id;
        if (state.selectedPerson){
          bannerEl.textContent = drawPhaseDone
            ? ('已選擇「' + p.name + '」，請點選座位')
            : ('已選擇「' + p.name + '」，請按下方「抽籤」');
        } else {
          bannerEl.textContent = ' ';
        }
        renderAll();
      });
      activeEl.appendChild(btn);
    });

    var canDraw = !drawPhaseDone && state.selectedPerson && state.order[state.selectedPerson] == null;
    drawBtn.disabled = !canDraw;

    pageDrawEl.hidden = drawPhaseDone;
    pageSeatEl.hidden = !drawPhaseDone;

    if (drawPhaseDone){
      subTitleEl.textContent = '依抽籤順序輪流選位，輪到的人員會自動標示';
      var remaining = PEOPLE.filter(function(p){ return !isPersonSeated(p.id); }).length;
      phaseNoteSeatEl.textContent = remaining > 0
        ? ('請依順序選位（尚餘 ' + remaining + ' 人）')
        : '所有人員皆已入座';
    } else {
      subTitleEl.textContent = '先選擇一位人員，按下「抽籤」決定順序';
      var undrawn = PEOPLE.filter(function(p){ return state.order[p.id] == null; }).length;
      phaseNoteEl.textContent = '尚有 ' + undrawn + ' 人未抽籤';
    }
  }

  function seatCard(seatId){
    var personId = state.seats[seatId];
    var seat = document.createElement('button');
    seat.type = 'button';
    seat.id = 'seat-' + seatId;
    var drawPhaseDone = allDrawn();

    if (personId){
      var p = personById(personId);
      seat.className = 'seat taken';
      seat.disabled = true;
      seat.innerHTML =
        '<span class="seat-label">' + seatId + '</span>' +
        '<span class="seat-badge">✓</span>' +
        '<span class="seat-avatar"><img src="' + p.img + '" alt="' + p.name + '"></span>' +
        '<span class="seat-name">' + p.name + '</span>';
    } else if (!drawPhaseDone){
      seat.className = 'seat locked';
      seat.disabled = true;
      seat.innerHTML =
        '<span class="seat-label">' + seatId + '</span>' +
        '<span class="seat-hint">等待抽籤</span>';
    } else {
      seat.className = 'seat';
      seat.innerHTML =
        '<span class="seat-label">' + seatId + '</span>' +
        '<span class="seat-hint">空位</span>';
      seat.addEventListener('click', function(){
        var turnId = currentTurnPersonId();
        if (!turnId){
          bannerEl.textContent = '所有人員皆已入座';
          return;
        }
        state.seats[seatId] = turnId;
        var p = personById(turnId);
        var nextId = currentTurnPersonId();
        bannerEl.textContent = nextId
          ? ('「' + p.name + '」已入座 ' + seatId + ' 位，換「' + personById(nextId).name + '」選位')
          : ('「' + p.name + '」已入座 ' + seatId + ' 位，所有人員皆已入座');
        renderAll();
        save();
        if (!nextId){
          showCompletionCelebration();
        }
      });
    }
    return seat;
  }

  var SEAT_POSITIONS = { A:[2,1], B:[4,1], C:[2,2], D:[4,2], E:[2,3] };

  function renderSeats(){
    seatGridEl.innerHTML = '';
    ['A','B','C','D','E'].forEach(function(id){
      var seat = seatCard(id);
      var pos = SEAT_POSITIONS[id];
      seat.style.gridColumn = pos[0];
      seat.style.gridRow = pos[1];
      seatGridEl.appendChild(seat);
    });
    var aisle = document.createElement('div');
    aisle.className = 'aisle';
    aisle.innerHTML = '<span class="aisle-label">走道</span>';
    seatGridEl.appendChild(aisle);

    var door = document.createElement('div');
    door.className = 'door';
    door.innerHTML = '<span class="door-label">前門</span>';
    seatGridEl.appendChild(door);
  }

  function renderAll(){
    renderRoster();
    renderSeats();
  }

  var CONFETTI_COLORS = ['#c1502e','#e0a05c','#7c9473','#5b7c99','#caa6d6'];

  function showDrawReveal(person, picked, tier, onDone){
    var overlay = document.createElement('div');
    overlay.className = 'draw-overlay';

    var confettiCount = tier * 14;
    for (var i=0;i<confettiCount;i++){
      var c = document.createElement('span');
      c.className = 'confetti';
      var dur = 1.4 + Math.random()*1.2 + tier*0.15;
      var delay = Math.random() * (0.5 + tier*0.15);
      c.style.left = (Math.random()*100) + '%';
      c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = delay + 's';
      c.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
      overlay.appendChild(c);
    }

    var card = document.createElement('div');
    card.className = 'draw-card' + (tier >= 4 ? ' shake' : '');
    card.innerHTML =
      (tier >= 3 ? '<span class="draw-rays"></span>' : '') +
      '<span class="draw-eyebrow">抽籤結果</span>' +
      '<span class="avatar"><img src="' + person.img + '" alt="' + person.name + '"></span>' +
      '<span class="draw-name">' + person.name + '</span>' +
      '<span class="draw-number' + (tier >= 4 ? ' glow' : '') + '">' + picked + '</span>' +
      '<span class="draw-caption">第 ' + picked + ' 順位</span>' +
      '<span class="draw-hint">點擊任意處繼續</span>';
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    var closed = false;
    function close(){
      if (closed) return;
      closed = true;
      overlay.remove();
      onDone();
    }
    overlay.addEventListener('click', close);
    setTimeout(close, 1500 + tier * 500);
  }

  function showCompletionCelebration(){
    var overlay = document.createElement('div');
    overlay.className = 'draw-overlay';

    for (var i=0;i<110;i++){
      var c = document.createElement('span');
      c.className = 'confetti';
      var dur = 1.6 + Math.random()*1.6;
      var delay = Math.random() * 0.9;
      c.style.left = (Math.random()*100) + '%';
      c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = delay + 's';
      c.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
      overlay.appendChild(c);
    }

    var seatOrder = ['A','B','C','D','E'];
    var lineup = seatOrder.map(function(seatId){
      var p = personById(state.seats[seatId]);
      return p
        ? '<span class="lineup-item"><span class="lineup-avatar"><img src="' + p.img + '" alt="' + p.name + '"></span><span class="lineup-seat">' + seatId + '</span></span>'
        : '';
    }).join('');

    var card = document.createElement('div');
    card.className = 'draw-card shake complete-card';
    card.innerHTML =
      '<span class="draw-rays"></span>' +
      '<span class="draw-eyebrow">座位安排完成</span>' +
      '<span class="complete-emoji">🎉</span>' +
      '<span class="draw-name">全部入座！</span>' +
      '<span class="lineup">' + lineup + '</span>' +
      '<span class="draw-hint">點擊任意處關閉</span>';
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); }
    overlay.addEventListener('click', close);
    setTimeout(close, 4500);
  }

  drawBtn.addEventListener('click', function(){
    var pid = state.selectedPerson;
    if (!pid || state.order[pid] != null) return;
    var used = PEOPLE.map(function(p){ return state.order[p.id]; }).filter(function(n){ return n != null; });
    var pool = [];
    for (var n=1;n<=PEOPLE.length;n++){ if (used.indexOf(n) === -1) pool.push(n); }
    var picked = pool[Math.floor(Math.random() * pool.length)];
    state.order[pid] = picked;
    var p = personById(pid);
    state.selectedPerson = null;
    var tier = PEOPLE.length + 1 - picked;
    showDrawReveal(p, picked, tier, function(){
      bannerEl.textContent = '「' + p.name + '」抽到第 ' + picked + ' 順位';
      if (allDrawn()){
        bannerEl.textContent += '，抽籤結束！請依順序選位';
      }
      renderAll();
      save();
    });
  });

  function resetAll(){
    state.selectedPerson = null;
    state.order = {};
    state.seats = {};
    bannerEl.textContent = ' ';
    renderAll();
    save();
  }
  resetBtn.addEventListener('click', resetAll);
  document.getElementById('resetBtnDraw').addEventListener('click', resetAll);

  function start(initial){
    if (initial && initial.seats) state.seats = initial.seats;
    if (initial && initial.order) state.order = initial.order;
    if (initial && initial.selectedPerson) state.selectedPerson = initial.selectedPerson;
    renderAll();
  }

  if (window.claude?.hot?.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude?.hot?.data || {});
  }
})();
</script>
